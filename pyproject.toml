[project]
name = "flowtix"
version = "0.1.0"
description = "FlowtTix — Intelligent RPA Platform"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
