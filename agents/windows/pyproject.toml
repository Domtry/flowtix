[project]
name = "flowtix-agent-windows"
version = "0.1.0"
description = "FlowtTix — Windows desktop automation agent"
requires-python = ">=3.11"
dependencies = [
    "pywinauto>=0.6.8,<1",
    "pyautogui>=0.9,<1",
    "pydantic>=2.7,<3",
    "structlog>=24.1,<25",
    "Pillow>=10.0,<11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "pytest-asyncio>=0.23,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
