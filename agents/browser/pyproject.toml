[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowtix-browser-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "playwright>=1.40,<2",
    "selenium>=4.10,<5",
    "httpx>=0.27,<1",
    "pywinauto>=0.6.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
