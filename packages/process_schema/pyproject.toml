[project]
name = "flowtix-process-schema"
version = "0.1.0"
description = "FlowtTix — Process definition schema and validation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "jsonschema>=4.22,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
