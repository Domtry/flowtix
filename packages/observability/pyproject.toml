[project]
name = "flowtix-observability"
version = "0.1.0"
description = "FlowtTix — Structured logging, OpenTelemetry tracing, metrics"
requires-python = ">=3.11"
dependencies = [
    "structlog>=24.1,<25",
    "opentelemetry-api>=1.24,<2",
    "opentelemetry-sdk>=1.24,<2",
    "opentelemetry-exporter-otlp>=1.24,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
