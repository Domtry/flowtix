[project]
name = "flowtix-orchestrator"
version = "0.1.0"
description = "FlowtTix — Orchestration service (Temporal-based)"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.6,<2",
    "pydantic>=2.7,<3",
    "structlog>=24.1,<25",
    "redis>=5.0,<6",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "pytest-asyncio>=0.23,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
