[project]
name = "flowtix-perception"
version = "0.1.0"
description = "FlowtTix — Perception engine (DOM, accessibility, OCR, vision)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "structlog>=24.1,<25",
    "mss>=9.0,<10",
]

[project.optional-dependencies]
ocr = ["paddleocr>=2.7,<3", "pytesseract>=0.3,<1"]
vision = ["opencv-python-headless>=4.9,<5"]
browser = ["playwright>=1.44,<2"]
windows = ["pywinauto>=0.6,<1", "comtypes>=1.4,<2"]
dev = ["pytest>=8.0,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
