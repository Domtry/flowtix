[project]
name = "flowtix-resource-manager"
version = "0.1.0"
description = "FlowtTix — CPU/GPU/RAM resource detection and management"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "psutil>=5.9,<6",
    "structlog>=24.1,<25",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
