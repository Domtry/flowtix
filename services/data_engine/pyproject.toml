[project]
name = "flowtix-data-engine"
version = "0.1.0"
description = "FlowtTix — Data manipulation engine"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
    "structlog>=24.1,<25",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24,<2"]
dev = ["pytest>=8.0,<9", "polars>=1.0,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
